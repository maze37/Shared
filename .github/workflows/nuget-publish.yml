name: Publish Mazeland.SharedKernel

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Shared.slnx

      - name: Build Solution
        run: dotnet build Shared.slnx -c Release --no-restore

      - name: Pack SharedKernel
        run: dotnet pack Shared.SharedKernel/Shared.SharedKernel.csproj -c Release --output ./nupkgs --no-build

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push ./nupkgs/*.nupkg 
          --source "https://nuget.pkg.github.com/maze37/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}" 
          --skip-duplicate
      
