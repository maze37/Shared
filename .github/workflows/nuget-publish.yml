name: Publish Mazeland.SharedKernel

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Solution
        run: dotnet build -c Release

      - name: Pack SharedKernel
        run: dotnet pack Shared.SharedKernel/Shared.SharedKernel.csproj -c Release --no-build --output ./nupkgs

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkgs/*.nupkg 
          --source https://api.nuget.org/v3/index.json 
          --api-key ${{ secrets.nuget-publish }} 
          --skip-duplicate